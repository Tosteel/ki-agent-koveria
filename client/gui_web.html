      pendingTasks.add(taskId);
      renderActiveTask();
      renderSidebarList();
      {
        const okPersist = await updateTaskForUser(task);
        if (!okPersist) {
          task.dialog.push({
            role: 'bot',
            text: 'Hinweis: Die Änderung konnte noch nicht in tasks_memory gespeichert werden.',
            timestamp: nowIso()
          });
        }
      }

      try {
        const resp = await fetch('/api/tasks/replan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            planned_steps: currentPlannedSteps,
            change_request: message,
            user_id: currentUserId
          })
        });
        const data = await resp.json();
        if (!resp.ok) {
          task.dialog.push({ role: 'bot', text: `Fehler: ${data.detail || 'Unbekannter Fehler'}`, timestamp: nowIso() });
          await updateTaskForUser(task);
          return;
        }
        if (data?.requires_user_input) {
          const msg = String(data?.message || '').trim() || 'Für die Plan-Änderung fehlen noch Informationen.';
          task.dialog.push({ role: 'bot', text: msg, timestamp: nowIso() });
          await updateTaskForUser(task);
          return;
        }
        const rawReplanText = String(data?.raw_text || '');
        let newSteps = Array.isArray(data?.planned_steps) ? data.planned_steps.map((s) => String(s).trim()).filter(Boolean) : [];
        if (newSteps.length === 0) {
          newSteps = extractPlannedStepsFromText(rawReplanText);
        }
        if (newSteps.length > 0) {
          task.planned_steps = newSteps;
          let updatedTaskText = '';
          try {
            const explainResp = await fetch('/api/planned-task-explain', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ steps: newSteps, user_id: currentUserId })
            });
            const explainData = await explainResp.json();
            if (explainResp.ok && String(explainData?.answer || '').trim()) {
              updatedTaskText = String(explainData.answer).trim();
            }
          } catch (_explainErr) {
            // fallback below
          }
          task.text = updatedTaskText || task.text || 'Aufgabe aktualisiert.';
          task.dialog.push({
            role: 'bot',
            text: 'Änderung erfolgreich durchgeführt.',
            timestamp: nowIso()
          });
        } else {
          task.dialog.push({
            role: 'bot',
            text: 'Hinweis: Es wurden keine neuen geplanten Schritte erkannt. Die vorhandene Planung bleibt unverändert.',
            timestamp: nowIso()
          });
        }
        const okPersist = await updateTaskForUser(task);
        if (!okPersist) {
          task.dialog.push({
            role: 'bot',
            text: 'Hinweis: Die aktualisierten Schritte konnten nicht in tasks_memory gespeichert werden.',
            timestamp: nowIso()
          });
        }
      } catch (_err) {
        task.dialog.push({ role: 'bot', text: 'Verbindung zur API fehlgeschlagen.', timestamp: nowIso() });
        const okPersist = await updateTaskForUser(task);
        if (!okPersist) {
          task.dialog.push({
            role: 'bot',
            text: 'Hinweis: Die Fehlermeldung konnte nicht in tasks_memory gespeichert werden.',
            timestamp: nowIso()
          });
        }
      } finally {
        pendingTasks.delete(taskId);
        renderActiveTask();
        renderSidebarList();
      }
    }

    function parseTriggerUpdateIntent(message, trigger) {
      const text = String(message || '').trim();
      const low = text.toLowerCase();
      const patch = {};
      const hints = [];

      if (/(manually|manual)/.test(low)) {
        patch.trigger_type = 'manually';
        patch.config = {};
      } else if (/(time_schedule|time scheduled|time-schedule|zeitplan|zeitgesteuert)/.test(low)) {
        patch.trigger_type = 'time_schedule';
        let seconds = null;
        const minMatch = low.match(/(\d+)\s*(min|minute|minuten)\b/);
        const secMatch = low.match(/(\d+)\s*(sek|sec|s|sekunden)\b/);
        const rawNum = low.match(/\b(\d+)\b/);
        if (minMatch) {
          seconds = Number(minMatch[1]) * 60;
        } else if (secMatch) {
          seconds = Number(secMatch[1]);
        } else if (rawNum) {
          seconds = Number(rawNum[1]);
        }
        if (!Number.isFinite(seconds) || seconds <= 0) {
          const current = Number(trigger?.config?.interval_seconds || 0);
          seconds = current > 0 ? current : 300;
          hints.push('Intervall nicht erkannt, verwende 300s.');
        }
        patch.config = { interval_seconds: Math.max(10, Math.min(86400, Math.trunc(seconds))) };
      }

      if (/(deaktiv|disable|aus)\b/.test(low)) {
        patch.enabled = false;
      } else if (/(aktiv|enable|ein)\b/.test(low)) {
        patch.enabled = true;
      }

      const nameMatch = text.match(/name\s*[:=]\s*(.+)$/i);
      if (nameMatch && nameMatch[1]) {
        patch.name = String(nameMatch[1]).trim();
      }

      return { patch, hints };
    }

    async function sendTriggerMessage() {
      const message = inputEl.value.trim();
      if (!message) return;
      const trigger = getActiveTrigger();
      if (!trigger) return;
      const triggerId = String(trigger.id || '').trim();
      if (!triggerId) return;
      if (pendingTriggers.has(triggerId)) return;

      const dialog = getTriggerDialog(triggerId);
      dialog.push({ role: 'user', text: message, timestamp: nowIso() });
      inputEl.value = '';
      pendingTriggers.add(triggerId);
      renderActiveTrigger();
      renderSidebarList();

      try {
        let patch = {};
        try {
          const interpretResp = await fetch('/api/triggers/interpret', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              user_id: currentUserId,
              trigger: {
                id: trigger.id,
                name: trigger.name,
                trigger_type: trigger.trigger_type,
                task_id: trigger.task_id,
                config: trigger.config || {},
                enabled: trigger.enabled
              },
              message
            })
          });
          const interpretData = await interpretResp.json();
          if (interpretResp.ok) {
            if (interpretData?.needs_info) {
              dialog.push({
                role: 'bot',
                text: String(interpretData?.question || 'Bitte präzisiere die gewünschte Trigger-Änderung.'),
                timestamp: nowIso()
              });
              return;
            }
            if (interpretData?.action === 'update_trigger' && interpretData?.patch && typeof interpretData.patch === 'object') {
              patch = interpretData.patch;
            }
          }
        } catch (_llmErr) {
          // fallback below
        }
        if (!Object.keys(patch).length) {
          const parsed = parseTriggerUpdateIntent(message, trigger);
          patch = parsed.patch || {};
        }
        if (!Object.keys(patch).length) {
          dialog.push({
            role: 'bot',
            text: 'Ich kann Trigger aktuell so anpassen: Typ (manually/time_schedule), Intervall (z.B. 300s oder 5 min), aktiv/deaktiv.',
            timestamp: nowIso()
          });
          return;
        }
        const result = await updateTrigger(triggerId, patch);
        if (!result.ok) {
          dialog.push({ role: 'bot', text: `Trigger-Update fehlgeschlagen: ${result.error || 'Unbekannter Fehler'}`, timestamp: nowIso() });
          return;
        }
        await loadTriggers(triggerId);
        dialog.push({ role: 'bot', text: 'Änderung erfolgreich durchgeführt.', timestamp: nowIso() });
      } catch (_err) {
        dialog.push({ role: 'bot', text: 'Trigger-Update fehlgeschlagen.', timestamp: nowIso() });
      } finally {
        pendingTriggers.delete(triggerId);
        renderActiveTrigger();
        renderSidebarList();
      }
    }

    async function saveSettingsNow() {
      settingsStatus.textContent = 'Speichere...';
      try {
        const payload = {
          ask_ionos_url: apiUrlEl.value.trim(),
          api_key: apiKeyEl.value.trim(),
          provider: modelProviderEl.value === 'openai' ? 'openai' : 'ionos',
          user_id: currentUserId
        };
        const resp = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) {
          settingsStatus.textContent = data.detail || 'Speichern fehlgeschlagen.';
          return;
        }
        currentUserId = String(data.user_id || '').trim();
        saveUserProfile(currentUserId, {
          ask_ionos_url: apiUrlEl.value.trim(),
          api_key: apiKeyEl.value.trim(),
          provider: modelProviderEl.value === 'openai' ? 'openai' : 'ionos'
        });
        setActiveUserInSession(currentUserId);
        settingsStatus.textContent = 'Gespeichert.';
        await loadChatMemory();
        await loadTasksMemory();
        await loadTriggers();
        await loadAgentsMemory();
        renderSidebarList();
        renderActivePane();
        setTimeout(() => { overlay.classList.remove('open'); }, 350);
      } catch (err) {
        settingsStatus.textContent = 'Speichern fehlgeschlagen.';
      }
    }

    async function sendMessage() {
      if (sidebarMode === 'triggers') {
        await sendTriggerMessage();
        return;
      }
      if (sidebarMode === 'tasks') {
        await sendTaskMessage();
        return;
      }
      if (sidebarMode === 'agents') {
        await sendAgentMessage();
        return;
      }
      const message = inputEl.value.trim();
      if (!message) return;

      const chat = getActiveChat();
      if (!chat) return;
      const targetChatId = chat.id;
      if (pendingChats.has(targetChatId)) return;

      const history = (chat.messages || [])
        .slice(-MAX_CONTEXT_MESSAGES)
        .map((msg) => ({ role: msg.role, text: msg.text }));

      if (!currentUserId) {
        addMessage('bot', 'Bitte zuerst API-Key in den Einstellungen speichern.');
        return;
      }

      addMessageToChat(targetChatId, 'user', message);
      setPendingBotPlaceholder(targetChatId, true);
      inputEl.value = '';
      pendingChats.add(targetChatId);
      refreshComposerState();
      renderSidebarList();

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history, user_id: currentUserId })
        });
        const data = await resp.json();
        if (!resp.ok) {
          setPendingBotPlaceholder(targetChatId, false);
          addMessage('bot', `Fehler: ${data.detail || 'Unbekannter Fehler'}`);
          return;
        }
        const plannedSteps = extractPlannedSteps(data.raw);
        const outputPath = extractDownloadPath(data.raw);
        setPendingBotPlaceholder(targetChatId, false);
        if (outputPath) {
          const fileName = fileNameFromPath(outputPath);
          const downloadUrl = `/api/download?path=${encodeURIComponent(outputPath)}&user_id=${encodeURIComponent(currentUserId)}`;
          addMessageToChat(targetChatId, 'bot', data.answer || 'Keine Antwort erhalten.', {
            downloadUrl,
            downloadLabel: `Download: ${fileName}`,
            plannedSteps
          });
        } else {
          addMessageToChat(targetChatId, 'bot', data.answer || 'Keine Antwort erhalten.', { plannedSteps });
        }
      } catch (err) {
        setPendingBotPlaceholder(targetChatId, false);
        addMessageToChat(targetChatId, 'bot', 'Verbindung zur API fehlgeschlagen.');
      } finally {
        setPendingBotPlaceholder(targetChatId, false);
        pendingChats.delete(targetChatId);
        refreshComposerState();
        renderSidebarList();
      }
    }

    menuBtn.addEventListener('click', async () => {
      overlay.classList.add('open');
      await loadSettings();
      apiUrlEl.focus();
    });

    cancelSettings.addEventListener('click', () => overlay.classList.remove('open'));
    saveSettings.addEventListener('click', saveSettingsNow);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });

    sendBtn.addEventListener('click', sendMessage);
    taskBtn.addEventListener('click', showLastPlannedTask);
    chatTitleEl.addEventListener('click', () => {
      const isTaskMode = sidebarMode === 'tasks';
      const isTriggerMode = sidebarMode === 'triggers';
      const isAgentMode = sidebarMode === 'agents';
      const task = isTaskMode ? getActiveTask() : null;
      const trigger = isTriggerMode ? getActiveTrigger() : null;
      const agent = isAgentMode ? getActiveAgent() : null;
      const chat = (!isTaskMode && !isTriggerMode && !isAgentMode) ? getActiveChat() : null;
      if (isTaskMode && !task) return;
      if (isTriggerMode && !trigger) return;
      if (isAgentMode && !agent) return;
      if (!isTaskMode && !isTriggerMode && !isAgentMode && !chat) return;
      const currentTitle = isTaskMode
        ? taskTitle(task)
        : (isTriggerMode
            ? (String(trigger.name || '').trim() || `Trigger ${String(trigger.id || '')}`)
            : (isAgentMode ? agentTitle(agent) : String(chat.title || 'Neuer Chat')));
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentTitle;
      input.style.width = '100%';
      input.style.maxWidth = '420px';
      input.style.fontSize = '16px';
      input.style.fontWeight = '700';
      input.style.border = '1px solid #c8d7f3';
      input.style.borderRadius = '6px';
      input.style.padding = '4px 8px';

      const commit = async () => {
        const next = String(input.value || '').trim();
        if (!next) {
          renderActivePane();
          return;
        }
        if (isTaskMode) {
          const ok = await renameTask(task.id, next);
          if (!ok) {
            renderActivePane();
            return;
          }
        } else if (isTriggerMode) {
          const ok = await renameTrigger(trigger.id, next);
          if (!ok) {
            renderActivePane();
            return;
          }
        } else if (isAgentMode) {
          const ok = await renameAgent(agent.id, next);
          if (!ok) {
            renderActivePane();
            return;
          }
        } else {
          chat.title = truncateTitle(next);
          touchChat(chat);
          scheduleChatMemorySave();
        }
        renderSidebarList();
        renderActivePane();
      };

      chatTitleEl.replaceWith(input);
      input.focus();
      input.select();

      const restoreTitleNode = () => {
        if (input.parentNode) {
          input.replaceWith(chatTitleEl);
        }
      };
      const oldCommit = commit;
      const wrappedCommit = async () => {
        await oldCommit();
        restoreTitleNode();
      };
      input.onblur = () => { void wrappedCommit(); };
      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          void wrappedCommit();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          restoreTitleNode();
          renderActivePane();
        }
      };
    });
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        void sendMessage();
      }
    });

    newChatBtn.addEventListener('click', () => {
      setSidebarMode('chats');
      startNewChat();
      if (isMobileView()) closeSidebar();
    });

    if (sidebarSearchInput) {
      sidebarSearchInput.addEventListener('input', () => {
        sidebarSearchQuery = String(sidebarSearchInput.value || '');
        renderSidebarList();
      });
    }

    modeChatsBtn.addEventListener('click', async () => {
      await loadChatMemory();
      await loadTasksMemory();
      await loadTriggers();
      await loadAgentsMemory();
      setSidebarMode('chats');
      if (isMobileView()) closeSidebar();
    });

    modeTasksBtn.addEventListener('click', async () => {
      await loadTasksMemory();
      await loadTriggers();
      await loadAgentsMemory();
      setSidebarMode('tasks');
      if (isMobileView()) closeSidebar();
    });

    modeTriggersBtn.addEventListener('click', async () => {
      await loadTasksMemory();
      await loadTriggers();
      await loadAgentsMemory();
      setSidebarMode('triggers');
      if (isMobileView()) closeSidebar();
    });

    if (modeToolsBtn) {
      modeToolsBtn.addEventListener('click', () => {
        // Platzhalter: Tools-Ansicht folgt.
      });
    }

    if (modeAgentsBtn) {
      modeAgentsBtn.addEventListener('click', async () => {
        await loadAgentsMemory();
        setSidebarMode('agents');
        if (isMobileView()) closeSidebar();
      });
    }

    if (sidebarToggleBtn) {
      sidebarToggleBtn.addEventListener('click', toggleSidebar);
    }
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', closeSidebar);
    }
    window.addEventListener('resize', () => {
      if (!isMobileView()) closeSidebar();
    });

    (async () => {
      await loadSettings();
      await loadChatMemory();
      await loadTasksMemory();
      await loadTriggers();
      await loadAgentsMemory();
      setSidebarMode('chats');
    })();
  </script>
</body>
