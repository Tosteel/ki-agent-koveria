<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Koveria Chat</title>
  <style>
    :root {
      --bg: #f1f4fb;
      --panel: #ffffff;
      --line: #dce3f4;
      --primary: #2f6de0;
      --primary-deep: #1b3ea8;
      --primary-soft: #6ea7ff;
      --text: #2b416b;
      --muted: #8296bf;
      --bubble: #edf2fc;
      --shadow: 0 18px 42px rgba(40, 76, 158, 0.20);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 10%, #f7f9ff 0%, #edf2fb 35%, #e9eef8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      height: min(760px, calc(100vh - 48px));
      background: var(--panel);
      border: 1px solid #e2e8f7;
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 220px 1fr;
    }

    .sidebar {
      background: #fff;
      color: #2b416b;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
    }

    .brand {
      display: block;
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand img {
      width: min(180px, 100%);
      height: auto;
      display: block;
    }

    .sidebar .search {
      margin: 14px 12px;
      background: #f7faff;
      border: 1px solid #d7e2f9;
      border-radius: 8px;
      height: 34px;
      color: #38527f;
      padding: 0 10px;
    }

    .sidebar .search::placeholder { color: #8ba0c7; }

    .menu {
      padding: 2px 8px 12px;
      overflow: auto;
      display: grid;
      gap: 6px;
    }

    .item {
      padding: 8px 8px;
      border-radius: 8px;
      font-size: 14px;
      color: #38527f;
      background: #fff;
      border: 1px solid #d9e4fb;
      cursor: pointer;
      user-select: none;
    }

    .item.active {
      background: #edf3ff;
      border-color: #b5cbf5;
    }

    .new-chat {
      margin: auto 12px 14px;
      background: linear-gradient(90deg, rgba(57, 135, 255, 0.9), rgba(113, 169, 255, 0.95));
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 9px;
      height: 42px;
      font-size: 24px;
      line-height: 0;
      cursor: pointer;
    }

    .chat {
      display: grid;
      grid-template-rows: 70px 1fr 84px;
      min-width: 0;
      min-height: 0;
    }

    .topbar {
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0 24px;
      background: linear-gradient(180deg, #fcfdff 0%, #f9fbff 100%);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: #223f71;
      letter-spacing: 0.3px;
    }

    .mobile-sidebar-toggle {
      display: none;
      border: 1px solid #d7e2f9;
      background: #f7faff;
      color: #4d6fae;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .actions button {
      border: 0;
      background: transparent;
      font-size: 26px;
      cursor: pointer;
      color: #7f98bf;
      padding: 4px 8px;
      border-radius: 8px;
    }

    .actions button:hover { background: #eef3fe; color: #567cbf; }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-logo {
      width: 34px;
      height: 34px;
      object-fit: cover;
      border-radius: 8px;
    }

    .messages {
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      padding: 20px 24px;
      display: grid;
      gap: 14px;
      align-content: start;
      background: #fbfcff;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: #c7d6f5;
      border-radius: 10px;
      border: 2px solid #fbfcff;
    }

    .messages::-webkit-scrollbar-track {
      background: #eef3ff;
    }

    .row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 100%;
    }

    .row.user { justify-content: flex-end; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #d9e6ff;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    .bubble {
      max-width: min(760px, 88%);
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--bubble);
      color: #2a4371;
      font-size: 16px;
      line-height: 1.38;
      border: 1px solid #e4ebfb;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .download-link {
      display: inline-block;
      margin-top: 8px;
      color: #2f6de0;
      text-decoration: none;
      font-weight: 600;
    }

    .download-link:hover {
      text-decoration: underline;
    }

    .user .bubble {
      background: #eef3fd;
      border-color: #e0e8fb;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #f8faff 0%, #f3f6fd 100%);
    }

    .composer input {
      flex: 1;
      border: 1px solid #d8e1f6;
      background: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
      color: #2f4876;
    }

    .composer input:focus { border-color: #8ab0f8; box-shadow: 0 0 0 3px rgba(87, 139, 241, 0.16); }

    .send {
      width: 50px;
      height: 50px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(145deg, #4b88ef, #2f6de0);
      color: white;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(51, 111, 231, 0.35);
    }

    .send:disabled { opacity: 0.6; cursor: not-allowed; }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(27, 45, 87, 0.34);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 15;
      padding: 20px;
    }

    .overlay.open { display: flex; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(27, 45, 87, 0.26);
      z-index: 12;
    }

    .sidebar-backdrop.open { display: block; }

    .modal {
      width: min(580px, 100%);
      background: #fff;
      border: 1px solid #d6e0f6;
      border-radius: 12px;
      box-shadow: 0 22px 52px rgba(20, 45, 92, 0.30);
      padding: 18px;
      display: grid;
      gap: 10px;
    }

    .modal h2 { margin: 0 0 2px; font-size: 22px; color: #203d70; }
    .modal label { font-size: 14px; color: #5b7198; }
    .modal input {
      width: 100%;
      border: 1px solid #d5e0f8;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
    }

    .modal .row-buttons {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      border: 1px solid #cdd9f3;
      background: #f5f8ff;
      color: #335384;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn.primary {
      border: 1px solid #2f6de0;
      background: linear-gradient(145deg, #4b88ef, #2f6de0);
      color: #fff;
    }

    .status {
      font-size: 13px;
      color: #6484ba;
      min-height: 18px;
    }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; height: calc(100vh - 20px); }
      .sidebar {
        display: flex;
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        width: min(320px, 84vw);
        z-index: 13;
        transform: translateX(-104%);
        transition: transform 0.2s ease;
        box-shadow: 0 20px 48px rgba(20, 45, 92, 0.35);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-sidebar-toggle { display: inline-block; }
      body { padding: 10px; }
      .topbar h1 { font-size: 22px; }
      .bubble { font-size: 16px; }
      .composer input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="/assets/logo.png" alt="Koveria" />
      </div>
      <input class="search" placeholder="Search" />
      <div class="menu" id="chatList"></div>
      <button class="new-chat" id="newChat" title="Neuer Chat">+</button>
    </aside>

    <section class="chat">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-sidebar-toggle" id="sidebarToggleBtn" title="Chats">💬</button>
          <h1 id="chatTitle">Neuer Chat</h1>
        </div>
        <div class="actions">
          <button id="menuBtn" title="Einstellungen">☰</button>
        </div>
      </header>

      <main id="messages" class="messages"></main>

      <footer class="composer">
        <input id="messageInput" type="text" placeholder="Nachricht eingeben..." />
        <button class="send" id="sendBtn" title="Senden">➤</button>
      </footer>
    </section>
  </div>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <h2>API Einstellungen</h2>
      <label for="apiUrl">askIonos Endpoint URL</label>
      <input id="apiUrl" type="text" placeholder="http://127.0.0.1:8012/agent/askIonos" />

      <label for="apiKey">API Key (Bearer, optional)</label>
      <input id="apiKey" type="password" placeholder="Token" />

      <div class="status" id="settingsStatus"></div>
      <div class="row-buttons">
        <button class="btn" id="cancelSettings">Abbrechen</button>
        <button class="btn primary" id="saveSettings">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChat');
    const chatListEl = document.getElementById('chatList');
    const chatTitleEl = document.getElementById('chatTitle');
    const sidebarEl = document.querySelector('.sidebar');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');

    const overlay = document.getElementById('settingsOverlay');
    const menuBtn = document.getElementById('menuBtn');
    const cancelSettings = document.getElementById('cancelSettings');
    const saveSettings = document.getElementById('saveSettings');
    const apiUrlEl = document.getElementById('apiUrl');
    const apiKeyEl = document.getElementById('apiKey');
    const settingsStatus = document.getElementById('settingsStatus');

    const BOT_WELCOME = 'Hallo! Wie kann ich Ihnen heute helfen?';
    const MAX_CONTEXT_MESSAGES = 12;
    const SAVE_DEBOUNCE_MS = 250;
    const PROFILES_STORAGE_KEY = 'koveria.web.profiles.v1';
    const ACTIVE_USER_STORAGE_KEY = 'koveria.web.active_user.v1';
    let nextChatId = 1;
    const chats = [];
    let activeChatId = null;
    let saveTimer = null;
    let currentUserId = '';

    function nowIso() {
      return new Date().toISOString();
    }

    function scheduleChatMemorySave() {
      if (saveTimer) window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => {
        saveTimer = null;
        void saveChatMemory();
      }, SAVE_DEBOUNCE_MS);
    }

    function touchChat(chat) {
      if (!chat) return;
      if (!chat.created_at) chat.created_at = nowIso();
      chat.updated_at = nowIso();
    }

    function loadProfilesCache() {
      try {
        const raw = window.localStorage.getItem(PROFILES_STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return {};
        return parsed;
      } catch (_err) {
        return {};
      }
    }

    function saveProfilesCache(profiles) {
      try {
        window.localStorage.setItem(PROFILES_STORAGE_KEY, JSON.stringify(profiles || {}));
      } catch (_err) {
        // ignore quota/storage errors
      }
    }

    function getActiveUserFromSession() {
      try {
        return String(window.sessionStorage.getItem(ACTIVE_USER_STORAGE_KEY) || '').trim();
      } catch (_err) {
        return '';
      }
    }

    function setActiveUserInSession(userId) {
      try {
        const clean = String(userId || '').trim();
        if (!clean) {
          window.sessionStorage.removeItem(ACTIVE_USER_STORAGE_KEY);
          return;
        }
        window.sessionStorage.setItem(ACTIVE_USER_STORAGE_KEY, clean);
      } catch (_err) {
        // ignore storage errors
      }
    }

    function saveUserProfile(userId, profile) {
      const cleanUserId = String(userId || '').trim();
      if (!cleanUserId) return;
      const profiles = loadProfilesCache();
      profiles[cleanUserId] = {
        ask_ionos_url: String(profile?.ask_ionos_url || '').trim(),
        api_key: String(profile?.api_key || '').trim()
      };
      saveProfilesCache(profiles);
    }

    function loadUserProfile(userId) {
      const cleanUserId = String(userId || '').trim();
      if (!cleanUserId) return null;
      const profiles = loadProfilesCache();
      const profile = profiles[cleanUserId];
      if (!profile || typeof profile !== 'object') return null;
      return {
        ask_ionos_url: String(profile.ask_ionos_url || '').trim(),
        api_key: String(profile.api_key || '').trim()
      };
    }

    function createMessageElement(role, text, meta = {}) {
      const row = document.createElement('div');
      row.className = `row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (role === 'bot') {
        const img = document.createElement('img');
        img.src = '/assets/bot-avatar.png';
        img.alt = 'bot';
        avatar.appendChild(img);
      } else {
        avatar.textContent = '👤';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      const textNode = document.createElement('div');
      textNode.textContent = text;
      bubble.appendChild(textNode);
      if (meta.downloadUrl) {
        const link = document.createElement('a');
        link.className = 'download-link';
        link.href = meta.downloadUrl;
        link.textContent = meta.downloadLabel || 'Datei herunterladen';
        link.setAttribute('download', '');
        bubble.appendChild(link);
      }

      if (role === 'user') {
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      return row;
    }

    function truncateTitle(value) {
      const text = (value || '').trim();
      if (!text) return 'Neuer Chat';
      return text.length > 36 ? `${text.slice(0, 36)}...` : text;
    }

    function getActiveChat() {
      return chats.find((chat) => chat.id === activeChatId) || null;
    }

    function isMobileView() {
      return window.matchMedia('(max-width: 960px)').matches;
    }

    function closeSidebar() {
      if (!sidebarEl || !sidebarBackdrop) return;
      sidebarEl.classList.remove('open');
      sidebarBackdrop.classList.remove('open');
    }

    function toggleSidebar() {
      if (!sidebarEl || !sidebarBackdrop) return;
      const open = sidebarEl.classList.toggle('open');
      sidebarBackdrop.classList.toggle('open', open);
    }

    function renameChat(chatId) {
      const chat = chats.find((entry) => entry.id === chatId);
      if (!chat) return;
      const input = window.prompt('Chat umbenennen', chat.title);
      if (input === null) return;
      chat.title = truncateTitle(input);
      touchChat(chat);
      renderChatList();
      renderActiveChat();
      scheduleChatMemorySave();
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      chats.forEach((chat) => {
        const item = document.createElement('div');
        item.className = `item${chat.id === activeChatId ? ' active' : ''}`;
        item.textContent = chat.title;
        item.title = 'Doppelklick zum Umbenennen';
        item.addEventListener('click', () => {
          activeChatId = chat.id;
          renderChatList();
          renderActiveChat();
          if (isMobileView()) closeSidebar();
          scheduleChatMemorySave();
        });
        item.addEventListener('dblclick', () => {
          renameChat(chat.id);
        });
        chatListEl.appendChild(item);
      });
    }

    function renderActiveChat() {
      const chat = getActiveChat();
      if (!chat) return;

      chatTitleEl.textContent = chat.title;
      messagesEl.innerHTML = '';
      chat.messages.forEach((msg) => {
        messagesEl.appendChild(createMessageElement(msg.role, msg.text, msg));
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(role, text, meta = {}) {
      const chat = getActiveChat();
      if (!chat) return;

      chat.messages.push({
        role,
        text,
        downloadUrl: meta.downloadUrl || '',
        downloadLabel: meta.downloadLabel || '',
        timestamp: nowIso()
      });
      touchChat(chat);
      if (role === 'user' && chat.title === 'Neuer Chat') {
        chat.title = truncateTitle(text);
      }
      renderChatList();
      renderActiveChat();
      scheduleChatMemorySave();
    }

    function extractDownloadPath(raw) {
      const outputs = Array.isArray(raw?.tool_outputs) ? raw.tool_outputs : [];
      for (let i = outputs.length - 1; i >= 0; i -= 1) {
        const out = outputs[i];
        if (!out || out.ok !== true) continue;
        const payload = out.payload;
        const outputPath = typeof payload?.output_path === 'string' ? payload.output_path.trim() : '';
        if (!outputPath) continue;
        const lower = outputPath.toLowerCase();
        if (lower.endsWith('.pdf') || lower.endsWith('.pptx')) return outputPath;
      }
      return '';
    }

    function fileNameFromPath(path) {
      const clean = String(path || '').trim();
      if (!clean) return 'Datei';
      const normalized = clean.replace(/\\/g, '/');
      const parts = normalized.split('/');
      return parts[parts.length - 1] || clean;
    }

    function startNewChat() {
      const ts = nowIso();
      const chat = {
        id: nextChatId++,
        title: 'Neuer Chat',
        messages: [{ role: 'bot', text: BOT_WELCOME, downloadUrl: '', downloadLabel: '', timestamp: ts }],
        created_at: ts,
        updated_at: ts
      };
      chats.unshift(chat);
      activeChatId = chat.id;
      renderChatList();
      renderActiveChat();
      scheduleChatMemorySave();
    }

    function setSending(isSending) {
      sendBtn.disabled = isSending;
      inputEl.disabled = isSending;
      if (!isSending) inputEl.focus();
    }

    async function loadSettings() {
      settingsStatus.textContent = '';
      const activeUser = getActiveUserFromSession();
      if (!activeUser) {
        currentUserId = '';
        apiUrlEl.value = '';
        apiKeyEl.value = '';
        return;
      }
      const profile = loadUserProfile(activeUser);
      if (!profile) {
        currentUserId = '';
        apiUrlEl.value = '';
        apiKeyEl.value = '';
        return;
      }
      currentUserId = activeUser;
      apiUrlEl.value = profile.ask_ionos_url || '';
      apiKeyEl.value = profile.api_key || '';
    }

    function applyLoadedChats(memory) {
      const rawChats = Array.isArray(memory?.chats) ? memory.chats : [];
      chats.length = 0;

      rawChats.forEach((entry) => {
        const id = Number(entry?.id);
        if (!Number.isInteger(id) || id < 1) return;
        const title = truncateTitle(String(entry?.title || 'Neuer Chat'));

        const rawMessages = Array.isArray(entry?.messages) ? entry.messages : [];
        const messages = rawMessages
          .map((m) => ({
            role: m?.role === 'user' ? 'user' : 'bot',
            text: String(m?.text || '').trim(),
            downloadUrl: String(m?.downloadUrl || ''),
            downloadLabel: String(m?.downloadLabel || ''),
            timestamp: String(m?.timestamp || nowIso())
          }))
          .filter((m) => m.text.length > 0);

        if (!messages.length) {
          messages.push({ role: 'bot', text: BOT_WELCOME, downloadUrl: '', downloadLabel: '', timestamp: nowIso() });
        }

        chats.push({
          id,
          title: title || 'Neuer Chat',
          messages,
          created_at: String(entry?.created_at || nowIso()),
          updated_at: String(entry?.updated_at || nowIso())
        });
      });

      nextChatId = chats.reduce((maxId, chat) => Math.max(maxId, chat.id), 0) + 1;
      const desiredActiveId = Number(memory?.active_chat_id);
      const hasDesiredActive = chats.some((chat) => chat.id === desiredActiveId);
      activeChatId = hasDesiredActive ? desiredActiveId : (chats[0]?.id || null);
    }

    async function loadChatMemory() {
      if (!currentUserId) {
        chats.length = 0;
        activeChatId = null;
        nextChatId = 1;
        startNewChat();
        return;
      }
      try {
        const resp = await fetch(`/api/chat-memory?user_id=${encodeURIComponent(currentUserId)}`);
        const data = await resp.json();
        if (!resp.ok) throw new Error('chat-memory');
        applyLoadedChats(data);
      } catch (_err) {
        chats.length = 0;
        activeChatId = null;
        nextChatId = 1;
      }

      if (!chats.length) {
        startNewChat();
        return;
      }
      renderChatList();
      renderActiveChat();
    }

    async function saveChatMemory() {
      const payload = {
        user_id: currentUserId,
        chats: chats.map((chat) => ({
          id: chat.id,
          title: chat.title,
          created_at: chat.created_at || nowIso(),
          updated_at: chat.updated_at || nowIso(),
          messages: (chat.messages || []).map((msg) => ({
            role: msg.role === 'user' ? 'user' : 'bot',
            text: msg.text || '',
            downloadUrl: msg.downloadUrl || '',
            downloadLabel: msg.downloadLabel || '',
            timestamp: msg.timestamp || nowIso()
          }))
        })),
        active_chat_id: activeChatId
      };
      if (!currentUserId) return;
      try {
        await fetch('/api/chat-memory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (_err) {
        // no-op; next mutation will retry
      }
    }

    async function saveSettingsNow() {
      settingsStatus.textContent = 'Speichere...';
      try {
        const payload = {
          ask_ionos_url: apiUrlEl.value.trim(),
          api_key: apiKeyEl.value.trim(),
          user_id: currentUserId
        };
        const resp = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) {
          settingsStatus.textContent = data.detail || 'Speichern fehlgeschlagen.';
          return;
        }
        currentUserId = String(data.user_id || '').trim();
        saveUserProfile(currentUserId, {
          ask_ionos_url: apiUrlEl.value.trim(),
          api_key: apiKeyEl.value.trim()
        });
        setActiveUserInSession(currentUserId);
        settingsStatus.textContent = 'Gespeichert.';
        await loadChatMemory();
        setTimeout(() => { overlay.classList.remove('open'); }, 350);
      } catch (err) {
        settingsStatus.textContent = 'Speichern fehlgeschlagen.';
      }
    }

    async function sendMessage() {
      const message = inputEl.value.trim();
      if (!message) return;

      const chat = getActiveChat();
      const history = (chat?.messages || [])
        .slice(-MAX_CONTEXT_MESSAGES)
        .map((msg) => ({ role: msg.role, text: msg.text }));

      if (!currentUserId) {
        addMessage('bot', 'Bitte zuerst API-Key in den Einstellungen speichern.');
        return;
      }

      addMessage('user', message);
      inputEl.value = '';
      setSending(true);

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, history, user_id: currentUserId })
        });
        const data = await resp.json();
        if (!resp.ok) {
          addMessage('bot', `Fehler: ${data.detail || 'Unbekannter Fehler'}`);
          return;
        }
        const outputPath = extractDownloadPath(data.raw);
        if (outputPath) {
          const fileName = fileNameFromPath(outputPath);
          const downloadUrl = `/api/download?path=${encodeURIComponent(outputPath)}&user_id=${encodeURIComponent(currentUserId)}`;
          addMessage('bot', data.answer || 'Keine Antwort erhalten.', {
            downloadUrl,
            downloadLabel: `Download: ${fileName}`
          });
        } else {
          addMessage('bot', data.answer || 'Keine Antwort erhalten.');
        }
      } catch (err) {
        addMessage('bot', 'Verbindung zur API fehlgeschlagen.');
      } finally {
        setSending(false);
      }
    }

    menuBtn.addEventListener('click', async () => {
      overlay.classList.add('open');
      await loadSettings();
      apiUrlEl.focus();
    });

    cancelSettings.addEventListener('click', () => overlay.classList.remove('open'));
    saveSettings.addEventListener('click', saveSettingsNow);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    newChatBtn.addEventListener('click', () => {
      startNewChat();
      if (isMobileView()) closeSidebar();
    });

    if (sidebarToggleBtn) {
      sidebarToggleBtn.addEventListener('click', toggleSidebar);
    }
    if (sidebarBackdrop) {
      sidebarBackdrop.addEventListener('click', closeSidebar);
    }
    window.addEventListener('resize', () => {
      if (!isMobileView()) closeSidebar();
    });

    (async () => {
      await loadSettings();
      await loadChatMemory();
    })();
  </script>
</body>
</html>
